[package]
name = "rust-zstd"
version = "0.4.1"
edition = "2021"
description = "Pure Rust Zstandard codec (compress and decompress), no C or FFI; depends on fearless_simd and bytemuck, plus rayon under the default parallel feature"
license = "BSD-3-Clause AND MIT"
repository = "https://github.com/physwkim/rust-zstd"
readme = "README.md"
keywords = ["zstd", "zstandard", "compression", "decompression", "lz77"]
categories = ["compression"]
exclude = ["tests/fixtures"]

[dependencies]
fearless_simd = "0.3.0"
bytemuck = "1"
rayon = { version = "1", optional = true }

[dev-dependencies]
zstd = { version = "0.13.3", features = ["zstdmt"] }

[features]
default = ["parallel"]
parallel = ["rayon"]
